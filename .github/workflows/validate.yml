name: Guide validation
on:
  push:
    branches: [main]
    paths: ['LICENSE.md','README.md','manifest.json','capabilities.json','compatibility.json','llms.txt','ROADMAP.md','CHANGELOG.md','docs/**','tools/**','tests/**','.github/workflows/**']
  pull_request:
    paths: ['tools/**','tests/**','.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/starter_build.py
