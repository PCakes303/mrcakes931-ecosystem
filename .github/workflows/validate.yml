name: Guide validation
on:
  push:
    branches: [main]
    paths: ['README.md','manifest.json','capabilities.json','compatibility.json','llms.txt','ROADMAP.md','CHANGELOG.md','docs/**','tools/**','tests/**','.github/workflows/**']
  pull_request:
    paths: ['tools/**','tests/**','.github/workflows/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python tools/starter_build.py
